# Finish the film on GitHub: take the picture-only render from a "Render film" run, add the mastered soundtrack
# (audio/master/soundtrack.m4a.part*, joined back together), and encode one TV-ready MP4 (H.264 CRF 21, AAC 320k copied).
# gh workflow run finish.yml -f run_id=<render run id>
# Patch only the end (e.g. after changing the credits): render the changed range with render.yml (start=<a> end=<film end>),
# then: gh workflow run finish.yml -f run_id=<full render run> -f patch_run_id=<range render run> -f patch_frame=<round(a*30)>
# → frames [0, patch_frame) come from the full render, the rest from the range render.
name: Finish film

on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'Run id of the "Render film" run whose rochester-video artifact to use', required: true }
      crf: { description: 'x264 quality (lower = bigger file)', default: '21' }
      patch_run_id: { description: 'Optional: run id of a "Render film" run that rendered only the end', default: '' }
      patch_frame: { description: 'Frame where the patch starts (= round(start second × fps))', default: '' }

permissions:
  contents: read
  actions: read

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { path: film }
      - uses: actions/download-artifact@v4
        with:
          name: rochester-video
          path: pic
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.patch_run_id != '' }}
        with:
          name: rochester-video
          path: patch
          run-id: ${{ inputs.patch_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Join picture and soundtrack, encode
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          cat film/audio/master/soundtrack.m4a.part* > soundtrack.m4a
          ffprobe -v error -show_entries format=duration -of csv=p=0 soundtrack.m4a
          ffprobe -v error -show_entries format=duration -of csv=p=0 pic/rochester-video.mp4
          ENC="-c:v libx264 -preset medium -crf ${{ inputs.crf }} -pix_fmt yuv420p -profile:v high -level 4.1 -color_primaries bt709 -color_trc bt709 -colorspace bt709 -c:a copy -movflags +faststart -shortest"
          if [ -f patch/rochester-video.mp4 ]; then
            F=${{ inputs.patch_frame }}; test -n "$F"
            ffprobe -v error -count_packets -select_streams v -show_entries stream=nb_read_packets -of csv=p=0 patch/rochester-video.mp4 | sed 's/^/patch frames: /' | tee -a "$GITHUB_STEP_SUMMARY"
            ffmpeg -v error -stats -y -i pic/rochester-video.mp4 -i patch/rochester-video.mp4 -i soundtrack.m4a \
              -filter_complex "[0:v]trim=end_frame=$F,setpts=PTS-STARTPTS[a];[1:v]setpts=PTS-STARTPTS[b];[a][b]concat=n=2:v=1:a=0[v]" \
              -map "[v]" -map 2:a $ENC rochester.mp4
          else
            ffmpeg -v error -stats -y -i pic/rochester-video.mp4 -i soundtrack.m4a -map 0:v -map 1:a $ENC rochester.mp4
          fi
          ls -l rochester.mp4 | tee -a "$GITHUB_STEP_SUMMARY"
          ffprobe -v error -count_packets -select_streams v -show_entries stream=nb_read_packets -show_entries format=duration -of compact rochester.mp4 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rochester
          path: rochester.mp4
          retention-days: 7
